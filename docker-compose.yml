services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis-local
    volumes:
      - jarvis_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    volumes:
      - jarvis_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      JARVIS_ENV: development
      DATABASE_URL: postgresql://jarvis:jarvis-local@postgres:5432/jarvis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-compose-jwt-secret-change-before-deploy
      JARVIS_ENCRYPTION_KEY: local-compose-encryption-secret-change-before-deploy
      CORS_ORIGINS: http://localhost:3000
      AUTO_CREATE_TABLES: "0"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./web:/app
      - jarvis_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  jarvis_postgres:
  jarvis_redis:
  jarvis_node_modules:
