name: JARVISPhone
options:
  bundleIdPrefix: com.mal19industries
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0
targets:
  JARVISPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources/JARVISPhone
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mal19industries.jarvisphone
        PRODUCT_NAME: JARVIS
        JARVIS_API_BASE_URL: "http://localhost:8000"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/JARVISPhone/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  JARVISPhone:
    build:
      targets:
        JARVISPhone: all
    run:
      config: Debug
